{% macro callout(msg) %}
    <div class="doc-callout doc-callout-default">
        <p>{{ msg|safe }}</p>
    </div>
{% endmacro %}

{% macro success(msg) %}
    <div class="doc-callout doc-callout-success">
        <svg width="20" height="20" style="min-width: 20px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="9 12 11 14 15 10"></polyline></svg>
        <p>{{ msg|safe }}</p>
    </div>
{% endmacro %}

        <p>{{ msg|safe }}</p>
    </div>
{% endmacro %}
