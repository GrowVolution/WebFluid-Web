{% set current = current | default('') %}

<aside class="docs-sidebar">
    <div class="docs-sidebar-inner">
        <details class="docs-version-select">
            <summary class="docs-version">
                <span class="docs-version-label">Version</span>
                <span class="docs-version-current">
            <span class="docs-version-tag">{{ version }}</span>
            <svg class="docs-version-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="m6 9 6 6 6-6"></path>
            </svg>
        </span>
            </summary>
            <div class="docs-version-menu">
                <a href="/latest/" class="docs-version-option {{ 'is-active' if version == latest else '' }}">
                    <span class="docs-version-tag">latest</span>
                </a>
                {% for v in versions %}
                    {% if v != latest %}
                        <a href="/v/{{ v }}/" class="docs-version-option {{ 'is-active' if v == version else '' }}">
                            <span class="docs-version-tag">{{ v }}</span>
                        </a>
                    {% endif %}
                {% endfor %}
            </div>
        </details>

        <nav class="docs-nav">
            <a href="#" class="docs-nav-link {{ 'is-active' if current == 'overview' }}">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/></svg>
                Overview
            </a>

            <a href="#" class="docs-nav-link {{ 'is-active' if current == 'getting-started' }}">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L3 14h9l-1 8 10-12h-9z"/></svg>
                Getting Started
            </a>

            <details class="docs-nav-group" {{ 'open' if current in ['additives-intro', 'additives-manifest'] }}>
                <summary class="docs-nav-summary">
                    <span class="docs-nav-summary-label">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
                        Additives
                    </span>
                    <svg class="docs-nav-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
                </summary>
                <div class="docs-nav-children">
                    <a href="#" class="docs-nav-child {{ 'is-active' if current == 'additives-intro' }}">Introduction</a>
                    <a href="#" class="docs-nav-child {{ 'is-active' if current == 'additives-manifest' }}">The Manifest</a>
                </div>
            </details>
        </nav>
    </div>
</aside>
