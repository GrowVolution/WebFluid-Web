###############################################################
#    Example compose stack for WebFluid-Web orchestration.    #
###############################################################

services:
  home:
    image: gr0wvolution/webfluid:beta
    command: ["home", "-h", "0.0.0.0"]
    volumes:
      - ./:/app
    networks:
      - traefik
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == worker
      labels:
        - traefik.enable=true

        - traefik.http.routers.myFramework.entrypoints=websecure
        - traefik.http.routers.myFramework.rule=Host(`example.com`) || Host(`www.example.com`)
        - traefik.http.routers.myFramework.service=myFramework
        - traefik.http.routers.myFramework.tls=true

        - traefik.http.services.myFramework.loadbalancer.server.port=8000

  docs:
    image: gr0wvolution/webfluid:beta
    command: ["docs", "-h", "0.0.0.0"]
    volumes:
      - ./:/app
    networks:
      - traefik
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == worker
      labels:
        - traefik.enable=true

        - traefik.http.routers.myDocs.entrypoints=websecure
        - traefik.http.routers.myDocs.rule=Host(`docs.example.com`)
        - traefik.http.routers.myDocs.service=myDocs
        - traefik.http.routers.myDocs.tls=true

        - traefik.http.services.myDocs.loadbalancer.server.port=8000

  ocean:
    build: .
    command: ["ocean", "-h", "0.0.0.0"]
    volumes:
      - ./:/app
    networks:
      - traefik
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == worker
      labels:
        - traefik.enable=true

        - traefik.http.routers.myOcean.entrypoints=websecure
        - traefik.http.routers.myOcean.rule=Host(`ocean.example.com`)
        - traefik.http.routers.myOcean.service=myOcean
        - traefik.http.routers.myOcean.tls=true

        - traefik.http.services.myOcean.loadbalancer.server.port=8000


networks:
  traefik: { external: true }